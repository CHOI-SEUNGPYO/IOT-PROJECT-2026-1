<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설정 - YAMNet</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header>
        <h2>🔊 YAMNet Monitor (설정)</h2>
        <nav>
            <a href="/">홈</a>
            <a href="/stats">통계</a>
            <a href="/settings">설정</a>
            <button class="theme-btn" onclick="toggleTheme()">🌙 모드 변경</button>
        </nav>
    </header>

    <div id="dangerPopup" class="toast-popup"></div>

    <div class="container">

        {% include 'status_box.html' %}

        <div class="card">
            <h3>⚙️ 시스템 경고 설정</h3>
            <p>위험(Danger) 상태로 판단할 확률 임계값을 설정합니다.</p>

            <div style="margin-top: 2rem;">
                <label for="thresholdSlider"><strong>위험 감지 임계값 (Threshold):</strong> <span
                        id="thresholdValue">85</span>%</label>
                <br><br>
                <input type="range" id="thresholdSlider" min="50" max="99" value="85" style="width: 100%;">
            </div>

            <button
                style="margin-top: 2rem; padding: 10px 20px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem;">
                설정 저장
            </button>
        </div>

    </div>

    <script>
        const slider = document.getElementById('thresholdSlider');
        const output = document.getElementById('thresholdValue');

        slider.oninput = function () {
            output.innerHTML = this.value;
        }
    </script>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
