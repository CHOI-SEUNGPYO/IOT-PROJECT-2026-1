<!-- templates/status_box.html -->
<div id="statusBox" class="card status-normal">
    <h1 id="statusTitle">데이터 로딩중...</h1>
    <p>감지된 소리: <strong id="statusSound">-</strong> (확률: <span id="statusProb">-</span>%)</p>

    <!-- 타이머 바 -->
    <div id="timerContainer"
        style="display: none; width: 100%; background-color: rgba(255,255,255,0.3); border-radius: 5px; margin-top: 15px; height: 10px; overflow: hidden;">
        <div id="timerBar" style="width: 100%; height: 100%; background-color: white; transition: width 1s linear;">
        </div>
    </div>

    <!-- 피드백 버튼 -->
    <button id="fineBtn" class="fine-btn" style="display: none;" onclick="reportFine()">
        ✅ 괜찮습니다 (알림 해제)
    </button>
</div>
